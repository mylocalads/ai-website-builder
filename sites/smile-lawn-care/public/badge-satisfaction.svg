<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="100% satisfaction guaranteed — Smile Lawn Care, rated 5.0 from 37 Google reviews">
  <defs>
    <path id="arcTop" d="M120 120 m-92 0 a92 92 0 0 1 184 0" fill="none"/>
    <path id="arcBottom" d="M120 120 m92 0 a92 92 0 0 1 -184 0" fill="none"/>
  </defs>

  <!-- Brand yellow ring, deep-green core. The core has to be dark: the badge
       carries white lettering, and white on #f5cf39 is 1.51:1. -->
  <circle cx="120" cy="120" r="116" fill="#f5cf39"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#2f4a17" stroke-width="2" stroke-dasharray="4 6" opacity="0.7"/>
  <circle cx="120" cy="120" r="88" fill="#2f4a17"/>

  <text font-family="Montserrat, Inter, sans-serif" font-size="19" font-weight="800" fill="#1a1a1a" letter-spacing="3.2">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">SATISFACTION GUARANTEED</textPath>
  </text>
  <text font-family="Montserrat, Inter, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" letter-spacing="3">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">SMILE LAWN CARE</textPath>
  </text>

  <!-- grass-blade mark -->
  <g fill="none" stroke="#f5cf39" stroke-width="7" stroke-linecap="round">
    <path d="M120 154 C118 138 112 124 100 112"/>
    <path d="M120 154 C122 138 128 124 140 112"/>
    <path d="M120 156 V116"/>
  </g>
  <path d="M86 156 h68" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <text x="120" y="80" text-anchor="middle" font-family="Montserrat, Inter, sans-serif" font-size="26" font-weight="800" fill="#f5cf39">100%</text>
  <text x="120" y="182" text-anchor="middle" font-family="Montserrat, Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="2">5.0 ★ 37 REVIEWS</text>
</svg>
