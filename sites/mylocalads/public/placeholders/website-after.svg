<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Website after placeholder">
  <defs>
    <linearGradient id="afterHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#0038ff" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0a0a12"/>
  <!-- Browser chrome -->
  <rect x="0" y="0" width="800" height="36" fill="#1b1b24"/>
  <circle cx="18" cy="18" r="5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="34" cy="18" r="5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="50" cy="18" r="5" fill="rgba(255,255,255,0.25)"/>
  <rect x="90" y="10" width="200" height="16" rx="8" fill="rgba(255,255,255,0.08)"/>
  <!-- Sticky blue nav -->
  <rect x="0" y="36" width="800" height="44" fill="#0038ff"/>
  <rect x="24" y="52" width="80" height="12" rx="2" fill="#ffffff"/>
  <rect x="360" y="54" width="60" height="8" rx="4" fill="rgba(255,255,255,0.9)"/>
  <rect x="440" y="54" width="60" height="8" rx="4" fill="rgba(255,255,255,0.9)"/>
  <rect x="520" y="54" width="60" height="8" rx="4" fill="rgba(255,255,255,0.9)"/>
  <rect x="670" y="48" width="100" height="20" rx="10" fill="#ffffff"/>
  <text x="720" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#0038ff">GET LEADS!</text>
  <!-- Hero -->
  <rect x="0" y="80" width="800" height="240" fill="url(#afterHero)"/>
  <text x="400" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" font-weight="900" fill="#ffffff">Instant Estimates. Real Leads.</text>
  <text x="400" y="205" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="rgba(255,255,255,0.75)">Get a free quote in 30 seconds — no phone tag required.</text>
  <rect x="300" y="230" width="200" height="46" rx="23" fill="#faf24c"/>
  <text x="400" y="259" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#000000">Get My Free Estimate →</text>
  <!-- Metric row -->
  <g font-family="Inter, sans-serif">
    <rect x="30" y="345" width="180" height="80" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
    <text x="50" y="385" font-size="24" font-weight="900" fill="#ffffff">4.9★</text>
    <text x="50" y="408" font-size="10" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="1.2">GOOGLE RATING</text>
    <rect x="230" y="345" width="180" height="80" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
    <text x="250" y="385" font-size="24" font-weight="900" fill="#ffffff">200+</text>
    <text x="250" y="408" font-size="10" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="1.2">JOBS COMPLETED</text>
    <rect x="430" y="345" width="180" height="80" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
    <text x="450" y="385" font-size="24" font-weight="900" fill="#ffffff">24/7</text>
    <text x="450" y="408" font-size="10" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="1.2">RESPONSE</text>
    <rect x="630" y="345" width="140" height="80" rx="10" fill="rgba(0,56,255,0.18)" stroke="rgba(0,56,255,0.45)"/>
    <text x="700" y="380" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">FINANCING</text>
    <text x="700" y="400" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">0% for 12 mo</text>
  </g>
  <!-- Bottom bar -->
  <rect x="0" y="450" width="800" height="50" fill="rgba(255,255,255,0.02)"/>
  <text x="30" y="480" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Live Chat active · Call tracking on · AI Assistant ready</text>
  <circle cx="770" cy="475" r="10" fill="#faf24c"/>
</svg>
