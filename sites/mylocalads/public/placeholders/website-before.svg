  <line x1="30" y1="322" x2="240" y2="322" stroke="#dddddd"/>
  <text x="30" y="340" font-family="Arial, sans-serif" font-size="10" fill="#666">• Roofing • Siding • Windows</text>
  <text x="30" y="356" font-family="Arial, sans-serif" font-size="10" fill="#666">• Kitchens • Bathrooms • Additions</text>
  <rect x="280" y="290" width="240" height="80" fill="#ffffff" stroke="#cccccc"/>
  <text x="290" y="312" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">CONTACT</text>
  <line x1="290" y1="322" x2="510" y2="322" stroke="#dddddd"/>
  <text x="290" y="340" font-family="Arial, sans-serif" font-size="10" fill="#666">Phone: 555-1234</text>
  <text x="290" y="356" font-family="Arial, sans-serif" font-size="10" fill="#666">Email: info@example.com</text>
  <rect x="540" y="290" width="240" height="80" fill="#ffffff" stroke="#cccccc"/>
  <text x="550" y="312" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">HOURS</text>
