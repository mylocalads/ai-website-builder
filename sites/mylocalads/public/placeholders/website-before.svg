  <text x="550" y="356" font-family="Arial, sans-serif" font-size="10" fill="#666">Weekends by appointment</text>
  <!-- More clutter -->
  <rect x="20" y="390" width="760" height="60" fill="#ffffe0" stroke="#e0d000"/>
  <text x="40" y="415" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">SPECIAL OFFER! CALL NOW FOR 10% OFF! LIMITED TIME!</text>
  <text x="40" y="435" font-family="Arial, sans-serif" font-size="10" fill="#666">Terms and conditions apply. Not valid with other offers. See store for details.</text>
  <rect x="0" y="470" width="800" height="30" fill="#333333"/>
  <text x="30" y="490" font-family="Arial, sans-serif" font-size="9" fill="#aaaaaa">© 2018 Copyright. All rights reserved.</text>
