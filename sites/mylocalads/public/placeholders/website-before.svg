  <rect x="30" y="200" width="120" height="34" fill="#7a9c3f"/>
  <text x="50" y="222" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">CLICK HERE</text>
  <!-- Cluttered blocks -->
