    <path id="arcBottom" d="M120 120 m92 0 a92 92 0 0 1 -184 0" fill="none"/>
  </defs>

  <circle cx="120" cy="120" r="116" fill="#f15537"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 6" opacity="0.85"/>
  <circle cx="120" cy="120" r="88" fill="#000000"/>

  <text font-family="Montserrat, Inter, sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="3.2">
